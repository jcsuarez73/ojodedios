
services:
  ojo_backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      # API Keys - obtener en los enlaces de abajo
      - N2YO_API_KEY=J5R39K-F2UC89-6FZAGX-5QM9
      - OPENSKY_USERNAME=TU_USUARIO_AQUI
      - OPENSKY_PASSWORD=TU_PASSWORD_AQUI
    # 👇 ESTA LÍNEA ES LA QUE FALTA PARA EL CORRETO ENRUTAMIENTO EN MAC 👇
    command: uvicorn api.main:app --host 0.0.0.0 --port 8095 --reload


